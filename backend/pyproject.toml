[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inquispace-backend"
version = "0.1.0"
description = "InquiSpace 单角色主题探究后端"
requires-python = ">=3.12,<3.16"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "jieba>=0.42,<1",
  "rank-bm25>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
